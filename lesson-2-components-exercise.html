<!DOCTYPE html>
<html>
  <head>
    <title>Components - Lesson 2</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>


    <script type="text/babel">

      function ProductDetails({title, price, discountPrice, imageSrc}) {

          const discount = discountPrice ?  (
            <div>
              <p><del>Price: {price}</del></p>
              <p>Discount price: {discountPrice}</p>
            </div>
            ) : (
              <p>Price: ${price}</p>
            );

        return (
          <div>
            <img src={imageSrc} />
            <p>{title}</p>
             {discount}
            <button>Add to Cart</button>
          </div>
        );
      }

      function App(){
        return (
          <>
            <ProductDetails title="Cotton socks" price="10.90" discountPrice = "5.45" imageSrc="cotton-socks.png"/>
            <ProductDetails title="Tennis balls" price="6.00" imageSrc="tennis-balls.png"/>
            <ProductDetails title="Plain T-Shirt" price="7.99" imageSrc="plain-t-shirt.png"/>
          </>
        );
              
      }


      const container = document.querySelector('.js-container');
      const root = ReactDOM.createRoot(container);
      root.render(<App />);
     
     

    </script>
  </body>
</html>
