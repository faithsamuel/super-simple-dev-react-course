<!DOCTYPE html>
<html>
  <head>
    <title>Lesson 3 Exercises</title>
  </head>
  <style>

    body{
      margin-top: 0px;
      margin-bottom: 0px;
    }

    .container{
      display: flex;
      justify-content: center;
      height: 100vh;
      background-color: rgb(222,222,222);
      align-items: center;
    }

    button{
      background-color: rgb(25,135,84);
      margin: 0px 4px;
      padding: 10px;
      border: 0px;
      color: white;
    }
  </style>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>


    <script type="text/babel">

      function App(){

        const [count, setCount] = React.useState(0);
        const increaseBtnRef = React.useRef(null);

        function increaseCount() {
            setCount(count + 1);

        }

        function resetCount() {
           setCount(0);
        }

        function autoClick() {
          setInterval(()=>{
            increaseBtnRef.current.click();
          }, 1000);
        }

        const counterText = count === 1 ? "time" : "times";

        return (
          <div className="container">
           
           <button
            ref={increaseBtnRef} 
            onClick={increaseCount}>Clicked {count} {counterText}</button>
            
            <button onClick={resetCount}>Reset</button>
            <button onClick={autoClick}>Auto Click</button>
          </div>
        );
              
      }


      const container = document.querySelector('.js-container');
      const root = ReactDOM.createRoot(container);
      root.render(<App />);
     
     

    </script>
  </body>
</html>
